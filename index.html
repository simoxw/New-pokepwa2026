<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PokePWA</title>
    <meta name="description" content="Un gioco in stile Pokémon comico e scherzoso." />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokePWA" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <style>
      /* Orientation lock message */
      #orientation-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #1a1a1a;
        color: white;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      @media (orientation: landscape) {
        #orientation-overlay {
          display: flex;
        }
      }
      body {
        touch-action: manipulation;
        -webkit-touch-callout: none;
        user-select: none;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="orientation-overlay">
      <div style="font-size: 3rem;">📱</div>
      <h2>Ruota il telefono!</h2>
      <p>Questo gioco è progettato per essere giocato solo in verticale. Ruota il tuo dispositivo per continuare.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
